<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>10lb Challenge</title>
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="10lb" />
  <script>
    (function () {
      var v = parseInt(localStorage.getItem('tenlb_cache_version') || '0', 10);
      window.__CACHE_VERSION = v;
      var s = document.createElement('style');
      s.textContent = '@font-face{font-family:"Material Symbols Rounded";font-style:normal;font-display:block;font-weight:100 700;src:url("./fonts/MaterialSymbolsRounded.woff2?v=' + v + '")format("woff2")}';
      document.head.appendChild(s);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg:#f6f8fb;
      --card:#fff;
      --text:#0f172a;
      --muted:#64748b;
      --brand:#0f766e;
      --danger:#b91c1c;
      --ok:#15803d;
      --border:#e2e8f0;
      --nav-bg:#ecfeff;
      --nav-border:#bae6fd;
      --header-offset:0px;
      /* Keep these aligned with MenuConfig in /source/constants.js. */
      --menu-height-ms:280ms;
      --menu-fade-ms:200ms;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family: Inter,system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
    header { position:sticky; top:0; z-index:3; background:var(--brand); color:#fff; padding:14px 16px; }
    .header-row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    h1 { margin:0; font-size:1.05rem; }
    nav {
      display:none;
      overflow:hidden;
      background:var(--brand);
      border-bottom:1px solid color-mix(in srgb, var(--brand) 65%, #000);
      transition:height var(--menu-height-ms) ease;
      will-change:height;
    }
    nav.has-items { display:block; }
    .nav-inner {
      display:flex;
      flex-direction:column;
      padding:8px 10px;
      gap:6px;
    }
    .menu-header {
      display:none;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      width:100%;
    }
    .menu-breadcrumb {
      display:none;
      align-items:center;
      gap:6px;
      flex:1 1 auto;
      min-width:0;
      overflow:hidden;
      color:rgba(255,255,255,.95);
      font-weight:700;
      padding:8px 0;
      white-space:nowrap;
    }
    .breadcrumb-link {
      color:inherit;
      text-decoration:none;
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .breadcrumb-link:hover { text-decoration:underline; }
    .breadcrumb-link:focus-visible { outline:2px solid rgba(255,255,255,.7); outline-offset:1px; border-radius:6px; }
    .breadcrumb-separator { opacity:.72; flex-shrink:0; }
    .menu-track {
      display:flex;
      flex-wrap:nowrap;
      min-width:0;
      gap:6px;
      align-items:flex-start;
      transition:opacity var(--menu-fade-ms) ease;
    }
    .menu-burger {
      display:none;
      border:1px solid color-mix(in srgb, #fff 25%, var(--brand));
      background:transparent;
      border-radius:10px;
      padding:7px 11px;
      color:rgba(255,255,255,.95);
      cursor:pointer;
      align-items:center;
      justify-content:center;
      gap:8px;
      align-self:flex-start;
      margin-left:auto;
      flex-shrink:0;
      transition:background-color .16s ease, border-color .16s ease;
    }
    .menu-burger:hover { background:color-mix(in srgb, #fff 8%, var(--brand)); }
    .menu-burger:focus-visible { outline:2px solid rgba(255,255,255,.7); outline-offset:1px; }
    .menu-burger-glyph { font-size:1.1rem; line-height:1; }
    .menu-burger-label { font-weight:700; }
    nav.needs-burger .menu-header,
    nav.needs-burger .menu-breadcrumb,
    nav.needs-burger .menu-burger { display:flex; }
    nav.needs-burger .menu-track {
      flex-wrap:wrap;
      width:100%;
      max-height:none;
      overflow:hidden;
      transform-origin:top right;
    }
    nav[data-menu-state="collapsed"] .menu-track {
      opacity:0;
      max-height:0;
      margin-top:0;
      pointer-events:none;
    }
    nav[data-menu-state="expanding"] .menu-track,
    nav[data-menu-state="collapsing"] .menu-track {
      pointer-events:none;
    }
    nav[data-menu-state="expanding"] .menu-track { opacity:0; }
    nav[data-menu-state="expanded"] .menu-track { opacity:1; }
    nav[data-menu-state="collapsing"] .menu-track { opacity:0; }
    .menu-item {
      border:1px solid color-mix(in srgb, #fff 25%, var(--brand));
      background:transparent;
      border-radius:10px;
      padding:7px 11px;
      font-weight:600;
      color:rgba(255,255,255,.95);
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      white-space:nowrap;
      transition:background-color .16s ease, border-color .16s ease;
    }
    .menu-item:hover { background:color-mix(in srgb, #fff 8%, var(--brand)); }
    .menu-item:focus-visible { outline:2px solid rgba(255,255,255,.7); outline-offset:1px; }
    .menu-item.active {
      background:color-mix(in srgb, #fff 16%, var(--brand));
      border-color:color-mix(in srgb, #fff 34%, var(--brand));
      color:#fff;
    }
    .menu-item .material-symbols-rounded { font-size:18px; line-height:1; }
    main { padding:12px; max-width:1100px; margin:0 auto; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .between { justify-content:space-between; }
    input, select, button, textarea { font:inherit; }
    input, select, textarea { width:100%; border:1px solid #cbd5e1; border-radius:10px; padding:8px; background:#fff; color:var(--text); }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
    input.is-invalid, select.is-invalid, textarea.is-invalid { border-color:#f1a5a5; background:#fff5f5; box-shadow:0 0 0 3px rgba(220,38,38,.08); }
    label { font-size:.9rem; color:#334155; font-weight:600; display:block; margin:8px 0 4px; }
    .field-error { display:none; margin-top:4px; font-size:.82rem; color:var(--danger); }
    .field-error.visible { display:block; }
    .btn { border:0; background:var(--brand); color:#fff; padding:9px 12px; border-radius:10px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:40px; }
    .btn.secondary { background:#334155; }
    .btn.danger { background:var(--danger); }
    .btn.warn { background:#d97706; }
    .btn:disabled { opacity:.72; cursor:wait; }
    .btn-icon { width:18px; min-width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; font-size:18px; line-height:1; }
    .btn-label { display:inline-flex; align-items:center; justify-content:center; }
    .material-symbols-rounded { font-family:'Material Symbols Rounded'; font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20; }
    .material-symbols-rounded.filled { font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20; }
    .btn-spinner {
      width:18px;
      height:18px;
      border-radius:50%;
      border:2px solid currentColor;
      border-top-color:transparent;
      animation:spin .8s linear infinite;
    }
    .muted { color:var(--muted); }
    .error { color:var(--danger); font-weight:600; }
    .ok { color:var(--ok); font-weight:600; }
    .grid { display:grid; grid-template-columns:1fr; gap:10px; }
    @media(min-width:760px){ .grid.two{grid-template-columns:1fr 1fr;} .grid.three{grid-template-columns:repeat(3,1fr);} }
    .list { display:flex; flex-direction:column; gap:8px; }
    .list-item { border:1px solid var(--border); border-radius:10px; padding:10px; background:#fff; }
    .list-item.active { border-color:#22c55e; background:#f0fdf4; }
    .table { width:100%; border-collapse:collapse; font-size:.92rem; }
    .table th,.table td { border-bottom:1px solid var(--border); padding:8px 6px; text-align:left; }
    .table tr.is-clickable { cursor:pointer; }
    .table tr.is-clickable:hover td,
    .table tr.is-clickable:focus-within td { background:color-mix(in srgb, var(--brand) 7%, #fff); }
    .table tr.is-clickable:focus-visible { outline:2px solid color-mix(in srgb, var(--brand) 30%, #fff); outline-offset:-2px; }
    .user-linkish { display:inline-flex; align-items:center; gap:6px; font-weight:700; color:var(--brand); }
    .selection-status { font-size:.9rem; color:var(--muted); }
    .holiday { color:#94a3b8; }
    .forfeit { color:#94a3b8; text-decoration:line-through; }
    .tag { background:#f1f5f9; color:#334155; padding:2px 8px; border-radius:999px; font-size:.75rem; font-weight:700; }
    .arrow-loss { color:#16a34a; }
    .arrow-gain { color:#dc2626; }
    .hidden { display:none !important; }
    .small { font-size:.85rem; }
    .week-nav button { border:1px solid #cbd5e1; background:#fff; border-radius:8px; padding:4px 8px; }
    .pill { padding:3px 8px; border-radius:999px; font-size:.75rem; font-weight:700; }
    .pill.warn { background:#fef3c7; color:#92400e; }
    .pill.ok { background:#dcfce7; color:#166534; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .tabs button { border:1px solid var(--border); background:#fff; border-radius:999px; padding:6px 10px; font-weight:600; }
    .tabs button.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    /* Tabs component */
    .tabs-component { margin-top:0; }
    .tab-list { display:flex; flex-wrap:wrap; border-bottom:2px solid var(--border); margin-bottom:0; gap:0; }
    .tab-btn { background:none; border:none; border-bottom:3px solid transparent; margin-bottom:-2px; padding:9px 16px; font-size:.9rem; font-weight:600; color:var(--muted); cursor:pointer; transition:color .15s, border-color .15s; }
    .tab-btn:hover { color:var(--text); }
    .tab-btn.active { color:var(--brand); border-bottom-color:var(--brand); }
    .tab-panel { padding:14px 0 0; }
    /* Header breadcrumb (Task 7) */
    .header-breadcrumb { font-size:.75rem; font-weight:700; color:rgba(255,255,255,.9); margin-top:3px; display:none; }
    .header-breadcrumb.visible { display:block; }
    .header-breadcrumb .breadcrumb-link { color:rgba(255,255,255,.9); text-decoration:none; }
    .header-breadcrumb .breadcrumb-link:hover { text-decoration:underline; }
    .header-breadcrumb .breadcrumb-separator { opacity:.72; }
    .right { margin-left:auto; }

    body[data-theme="teal"] { --brand:#0f766e; --bg:#f6f8fb; --card:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --nav-bg:#ecfeff; --nav-border:#bae6fd; }
    body[data-theme="indigo"] { --brand:#4338ca; --bg:#eef2ff; --card:#ffffff; --text:#1e1b4b; --muted:#6366f1; --border:#c7d2fe; --nav-bg:#e0e7ff; --nav-border:#a5b4fc; }
    body[data-theme="rose"] { --brand:#be123c; --bg:#fff1f2; --card:#ffffff; --text:#500724; --muted:#9f1239; --border:#fecdd3; --nav-bg:#ffe4e6; --nav-border:#fda4af; }
    body[data-theme="slate"] { --brand:#334155; --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#475569; --border:#cbd5e1; --nav-bg:#f1f5f9; --nav-border:#cbd5e1; }
    body[data-theme="emerald"] { --brand:#047857; --bg:#ecfdf5; --card:#ffffff; --text:#064e3b; --muted:#047857; --border:#a7f3d0; --nav-bg:#d1fae5; --nav-border:#6ee7b7; }
    .snackbar-host { position:sticky; top:var(--header-offset); z-index:2; pointer-events:none; display:flex; flex-direction:column; }
    .snackbar-host:empty { display:none; }
    .snackbar {
      display:flex;
      align-items:center;
      gap:8px;
      padding:7px 14px;
      pointer-events:auto;
      animation:snack-slide-in 0.28s cubic-bezier(0.34,1.56,0.64,1) forwards;
      font-size:.85rem;
      line-height:1.3;
    }
    .snackbar.success { background:#16a34a; color:#fff; }
    .snackbar.error { background:#dc2626; color:#fff; }
    .snackbar-text { flex:1; font-weight:600; }
    .snackbar-close { background:none; border:none; cursor:pointer; color:rgba(255,255,255,0.85); padding:0; margin-left:8px; font-size:1rem; line-height:1; flex-shrink:0; display:flex; align-items:center; }
    .snackbar-close:hover { color:#fff; }
    @keyframes snack-slide-in { from { transform:translateY(-8px); opacity:0.6; } to { transform:translateY(0); opacity:1; } }
    @keyframes spin { to { transform:rotate(360deg); } }
    .sync-spin { display:inline-block; animation:spin .8s linear infinite; }
    .sync-warn-banner { background:#fef3c7; color:#92400e; border:1px solid #fcd34d; border-radius:10px; padding:10px 14px; margin-bottom:12px; display:flex; align-items:center; gap:8px; font-size:.9rem; }
    .sync-warn-banner .material-symbols-rounded { font-size:20px; flex-shrink:0; }
    body.is-syncing form { pointer-events:none; opacity:0.65; }
    .site-footer { border-top:1px solid var(--border); margin-top:24px; padding:16px 12px; padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px)); color:var(--muted); font-size:.82rem; }
    .site-footer-inner { max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:4px; }
  </style>
</head>
<body data-theme="teal">
  <div id="app-shell-root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-router-dom@6/umd/react-router-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js" crossorigin></script>
<script>
  (function () {
    var s = document.createElement('script');
    s.src = './bundle.js?v=' + (window.__CACHE_VERSION || 0);
    document.body.appendChild(s);
  })();
</script>
</body>
</html>

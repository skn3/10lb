<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>10lb Challenge</title>
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <style>
    :root {
      color-scheme: light;
      --bg:#f6f8fb;
      --card:#fff;
      --text:#0f172a;
      --muted:#64748b;
      --brand:#0f766e;
      --danger:#b91c1c;
      --ok:#15803d;
      --border:#e2e8f0;
      --nav-bg:#ecfeff;
      --nav-border:#bae6fd;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family: Inter,system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
    header { position:sticky; top:0; z-index:3; background:var(--brand); color:#fff; padding:14px 16px; }
    .header-row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    h1 { margin:0; font-size:1.05rem; }
    nav { display:flex; gap:8px; padding:10px; flex-wrap:wrap; background:var(--nav-bg); border-bottom:1px solid var(--nav-border); }
    nav button { border:1px solid #cbd5e1; background:#fff; border-radius:999px; padding:8px 12px; font-weight:600; }
    nav button.active { background:var(--brand); border-color:var(--brand); color:#fff; }
    main { padding:12px; max-width:1100px; margin:0 auto; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .between { justify-content:space-between; }
    input, select, button, textarea { font:inherit; }
    input, select, textarea { width:100%; border:1px solid #cbd5e1; border-radius:10px; padding:8px; background:#fff; color:var(--text); }
    label { font-size:.9rem; color:#334155; font-weight:600; display:block; margin:8px 0 4px; }
    .btn { border:0; background:var(--brand); color:#fff; padding:9px 12px; border-radius:10px; font-weight:700; cursor:pointer; }
    .btn.secondary { background:#334155; }
    .btn.danger { background:var(--danger); }
    .btn.warn { background:#d97706; }
    .muted { color:var(--muted); }
    .error { color:var(--danger); font-weight:600; }
    .ok { color:var(--ok); font-weight:600; }
    .grid { display:grid; grid-template-columns:1fr; gap:10px; }

    .list { display:flex; flex-direction:column; gap:8px; }

    .list-item.active { border-color:#22c55e; background:#f0fdf4; }

    .holiday { color:#94a3b8; }

    .pill { padding:3px 8px; border-radius:999px; font-size:.75rem; font-weight:700; }

    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .tabs button { border:1px solid var(--border); background:#fff; border-radius:999px; padding:6px 10px; font-weight:600; }
    .tabs button.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    .right { margin-left:auto; }

    body[data-theme="teal"] { --brand:#0f766e; --bg:#f6f8fb; --card:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --nav-bg:#ecfeff; --nav-border:#bae6fd; }
    body[data-theme="indigo"] { --brand:#4338ca; --bg:#eef2ff; --card:#ffffff; --text:#1e1b4b; --muted:#6366f1; --border:#c7d2fe; --nav-bg:#e0e7ff; --nav-border:#a5b4fc; }
    body[data-theme="rose"] { --brand:#be123c; --bg:#fff1f2; --card:#ffffff; --text:#500724; --muted:#9f1239; --border:#fecdd3; --nav-bg:#ffe4e6; --nav-border:#fda4af; }
    body[data-theme="slate"] { --brand:#334155; --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#475569; --border:#cbd5e1; --nav-bg:#f1f5f9; --nav-border:#cbd5e1; }
    body[data-theme="emerald"] { --brand:#047857; --bg:#ecfdf5; --card:#ffffff; --text:#064e3b; --muted:#047857; --border:#a7f3d0; --nav-bg:#d1fae5; --nav-border:#6ee7b7; }
  </style>
</head>
<body data-theme="teal">
  <header>
    <div class="header-row">
      <h1 id="server-title">10lb Challenge</h1>
      <div class="row small" id="auth-chip"></div>
    </div>
    <div id="sync-bar" style="display:none;font-size:.75rem;padding:2px 0 4px;opacity:.85"></div>
  </header>
  <nav id="nav"></nav>
  <main id="app"></main>

<script>
// =============================================================================
// CONFIG
// DB_VERSION history:
//   1 – initial schema
//   2 – added weeklySnapshots
//   3 – added syncQueue, deviceMeta key; added version/createdBy/updatedBy/
//       clientId/deletedAt to users, rounds, submissions; added updatedAt to
//       submissions
//   4 – added invites store (for invite-code-based registration)
// =============================================================================
const Config = { DB_NAME: 'tenlb-challenge', DB_VERSION: 4 };

const Utils = {
  id: () => (crypto && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`),
  round2: (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100,
  pct: (n) => `${Number(n || 0).toFixed(2)}%`,
  esc: (s) => String(s ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;'),
  escAttr: (s) => String(s ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replace(/\"/g, '&quot;').replace(/'/g, '&#39;'),
  safeNum: (v, d = 0) => {
    const n = Number(v);
    return Number.isFinite(n) ? n : d;
  },
  date: (d) => d ? new Date(d).toLocaleDateString('en-GB') : '—',
  dateTime: (d) => d ? new Date(d).toLocaleString('en-GB') : '—',
  weekdayName: (i) => ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][Number(i) || 0],
  clone: (v) => JSON.parse(JSON.stringify(v)),
  fullName: (user) => [user?.firstName || '', user?.lastName || ''].join(' ').trim() || user?.name || user?.username || 'Unknown user',
  parseName: (fullName) => {
    const parts = String(fullName || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return { firstName: '', lastName: '' };
    if (parts.length === 1) return { firstName: parts[0], lastName: '' };
    return { firstName: parts[0], lastName: parts.slice(1).join(' ') };
  },
  validPassword: (password) => /^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}$/.test(password || ''),
  money: (n, currency = '£') => `${currency}${Number(n || 0).toFixed(2)}`,
  weight: (n, fmt = 'lb') => `${Number(n || 0)}${fmt}`,
  setCookie(name, value, days) {
    const expires = new Date(Date.now() + (days * 86400000)).toUTCString();
    document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
  },
  getCookie(name) {
    const key = `${encodeURIComponent(name)}=`;
    const row = document.cookie.split(';').map((x) => x.trim()).find((x) => x.startsWith(key));
    return row ? decodeURIComponent(row.slice(key.length)) : null;
  },
  clearCookie(name) {
    document.cookie = `${encodeURIComponent(name)}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax`;
  }
};

const Security = {
  encoder: new TextEncoder(),
  toB64(bytes) {
    let binary = '';
    bytes.forEach((b) => { binary += String.fromCharCode(b); });
    return btoa(binary);
  },
  fromB64(base64) {
    const raw = atob(base64);
    return Uint8Array.from(raw, (x) => x.charCodeAt(0));
  },
  async hashPassword(password, saltBytes, iterations = 150000) {
    const key = await crypto.subtle.importKey('raw', this.encoder.encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: saltBytes, iterations, hash: 'SHA-256' }, key, 256);
    return this.toB64(new Uint8Array(bits));
  },
  async createPasswordRecord(password) {
    const saltBytes = crypto.getRandomValues(new Uint8Array(16));
    const iterations = 150000;
    const hash = await this.hashPassword(password, saltBytes, iterations);
    return { algorithm: 'PBKDF2-SHA256', iterations, salt: this.toB64(saltBytes), hash };
  },
  async verifyPassword(password, record) {
    if (!record?.salt || !record?.hash || !record?.iterations) return false;
    const hash = await this.hashPassword(password, this.fromB64(record.salt), record.iterations);
    return hash === record.hash;
  },
  sessionToken() {
    const bytes = crypto.getRandomValues(new Uint8Array(32));
    return this.toB64(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
};

// =============================================================================
// DEVICE IDENTITY
// A stable per-browser clientId stored in localStorage.
// This is separate from userId (who is logged in) and sessionToken.
// =============================================================================
const Device = {
  _id: null,
  getId() {
    if (this._id) return this._id;
    let id = localStorage.getItem('tenlb_clientId');
    if (!id) {
      id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      localStorage.setItem('tenlb_clientId', id);
    }
    this._id = id;
    return id;
  }
};

const ThemeOptions = [
  { key: 'teal', label: 'Teal Breeze' },
  { key: 'indigo', label: 'Indigo Glow' },
  { key: 'rose', label: 'Rose Quartz' },
  { key: 'slate', label: 'Slate Steel' },
  { key: 'emerald', label: 'Emerald Mist' }
];

// =============================================================================
// STORAGE ADAPTER INTERFACE (documentation)
// Both OfflineAdapter and FirestoreAdapter must implement:
//   init()
//   getAppSettings() → settings object
//   saveAppSettings(settings)
//   listRounds() → Round[]
//   getRound(id) → Round|null
//   createRound(roundInput) → Round
//   updateRound(round) → Round
//   deleteRound(id)
//   listUsers() → User[]
//   getUserById(id) → User|null
//   getUserByUsername(username) → User|null
//   createUser(user) → User
//   updateUser(user) → User
//   deleteUser(id)
//   upsertUsersByName(names) → User[]
//   listSubmissions() → Submission[]
//   recordSubmissionAndSnapshot(submission, snapshot)
//   getWeeklySnapshot(roundId, weekNumber) → Snapshot|null
//   createSession(token, userId, durationDays) → Session
//   getSession(token) → Session|null
//   touchSession(token, durationDays) → Session|null
//   deleteSession(token)
//   clearAllData()
// =============================================================================

// =============================================================================
// OFFLINE ADAPTER — IndexedDB implementation (Local Mode source of truth)
// =============================================================================
const OfflineAdapter = (() => {
  let db;

  // ---------------------------------------------------------------------------
  // Low-level DB helpers
  // ---------------------------------------------------------------------------
  const open = () => new Promise((resolve, reject) => {
    if (db) return resolve(db);
    const req = indexedDB.open(Config.DB_NAME, Config.DB_VERSION);

    req.onupgradeneeded = (event) => {
      const x = req.result;
      const oldVersion = event.oldVersion;

      // --- Create stores that didn't exist ---
      if (!x.objectStoreNames.contains('rounds')) x.createObjectStore('rounds', { keyPath: 'id' });
      if (!x.objectStoreNames.contains('users')) x.createObjectStore('users', { keyPath: 'id' });
      if (!x.objectStoreNames.contains('submissions')) {
        const s = x.createObjectStore('submissions', { keyPath: 'id' });
        s.createIndex('roundId', 'roundId', { unique: false });
      }
      if (!x.objectStoreNames.contains('weeklySnapshots')) x.createObjectStore('weeklySnapshots', { keyPath: 'id' });
      if (!x.objectStoreNames.contains('settings')) x.createObjectStore('settings', { keyPath: 'key' });
      if (!x.objectStoreNames.contains('sessions')) {
        const sess = x.createObjectStore('sessions', { keyPath: 'token' });
        sess.createIndex('userId', 'userId', { unique: false });
      }
      // v3: sync queue + device-local sync metadata
      if (!x.objectStoreNames.contains('syncQueue')) {
        const q = x.createObjectStore('syncQueue', { keyPath: 'changeId' });
        q.createIndex('status', 'status', { unique: false });
        q.createIndex('entityType', 'entityType', { unique: false });
      }
      // v4: invite codes for registration
      if (!x.objectStoreNames.contains('invites')) {
        const inv = x.createObjectStore('invites', { keyPath: 'id' });
        inv.createIndex('code', 'code', { unique: true });
      }

      // --- v3 data migration: backfill new metadata fields on existing records ---
      // This runs inside the upgradeneeded transaction so it is safe.
      if (oldVersion > 0 && oldVersion < 3) {
        const clientId = Device.getId();
        const now = new Date().toISOString();

        const migrateStore = (storeName) => {
          const store = req.transaction.objectStore(storeName);
          const cursorReq = store.openCursor();
          cursorReq.onsuccess = (e) => {
            const cursor = e.target.result;
            if (!cursor) return;
            const rec = cursor.value;
            cursor.update({
              ...rec,
              version: rec.version ?? 1,
              createdBy: rec.createdBy ?? rec.userId ?? null,
              updatedBy: rec.updatedBy ?? rec.userId ?? null,
              clientId: rec.clientId ?? clientId,
              deletedAt: rec.deletedAt ?? null
            });
            cursor.continue();
          };
        };

        migrateStore('users');
        migrateStore('rounds');

        // submissions also get updatedAt
        const subsStore = req.transaction.objectStore('submissions');
        const subsCursor = subsStore.openCursor();
        subsCursor.onsuccess = (e) => {
          const cursor = e.target.result;
          if (!cursor) return;
          const rec = cursor.value;
          cursor.update({
            ...rec,
            version: rec.version ?? 1,
            createdBy: rec.createdBy ?? rec.userId ?? null,
            updatedBy: rec.updatedBy ?? rec.userId ?? null,
            clientId: rec.clientId ?? clientId,
            deletedAt: rec.deletedAt ?? null,
            updatedAt: rec.updatedAt ?? rec.createdAt ?? now
          });
          cursor.continue();
        };
      }
    };

    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });

  const run = async (stores, mode, fn) => {
    const conn = await open();
    return new Promise((resolve, reject) => {
      const tx = conn.transaction(stores, mode);
      const obj = Object.fromEntries(stores.map((s) => [s, tx.objectStore(s)]));
      let out;
      tx.oncomplete = () => resolve(out);
      tx.onerror = () => reject(tx.error);
      Promise.resolve(fn(obj, tx)).then((result) => { out = result; }).catch(reject);
    });
  };

  const getAll = (store) => run([store], 'readonly', ({ [store]: s }) => new Promise((res, rej) => {
    const req = s.getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  }));

  const put = (store, value) => run([store], 'readwrite', ({ [store]: s }) => new Promise((res, rej) => {
    const req = s.put(value);
    req.onsuccess = () => res(value);
    req.onerror = () => rej(req.error);
  }));

  const del = (store, key) => run([store], 'readwrite', ({ [store]: s }) => new Promise((res, rej) => {
    const req = s.delete(key);
    req.onsuccess = () => res(true);
    req.onerror = () => rej(req.error);
  }));

  const get = (store, key) => run([store], 'readonly', ({ [store]: s }) => new Promise((res, rej) => {
    const req = s.get(key);
    req.onsuccess = () => res(req.result || null);
    req.onerror = () => rej(req.error);
  }));

  // ---------------------------------------------------------------------------
  // Record normalization helpers
  // ---------------------------------------------------------------------------
  const defaultAppSettings = () => ({
    key: 'app',
    installed: false,
    serverName: '10lb Challenge',
    weightFormat: 'lb',
    currency: '£',
    theme: 'teal',
    sessionDurationDays: 7,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  });

  const metaDefaults = (existing = {}) => {
    const clientId = Device.getId();
    return {
      version: 1,
      createdBy: null,
      updatedBy: null,
      clientId,
      deletedAt: null,
      ...existing
    };
  };

  const normalizeUser = (u) => {
    if (!u) return null;
    const parsed = Utils.parseName(u.name || Utils.fullName(u));
    return {
      ...metaDefaults(u),
      id: u.id || Utils.id(),
      username: u.username || (u.name ? u.name.toLowerCase().replace(/\s+/g, '.') : ''),
      firstName: u.firstName || parsed.firstName,
      lastName: u.lastName || parsed.lastName,
      password: u.password || null,
      isAdmin: !!u.isAdmin,
      isMaster: !!u.isMaster,
      createdAt: u.createdAt || new Date().toISOString(),
      updatedAt: u.updatedAt || new Date().toISOString(),
      lastLoginAt: u.lastLoginAt || null
    };
  };

  const normalizeSubmission = (s) => ({
    ...metaDefaults(s),
    ...s,
    updatedAt: s.updatedAt || s.createdAt || new Date().toISOString()
  });

  // ---------------------------------------------------------------------------
  // Sync queue helpers (used by SyncEngine)
  // ---------------------------------------------------------------------------
  const enqueue = (entityType, entityId, operation, payload, userId) => {
    const now = new Date().toISOString();
    const entry = {
      changeId: Utils.id(),
      entityType,
      entityId,
      operation,         // 'CREATE' | 'UPDATE' | 'DELETE'
      payload: Utils.clone(payload),
      timestamp: now,
      clientId: Device.getId(),
      userId: userId || null,
      status: 'pending', // 'pending' | 'uploading' | 'done' | 'error'
      retryCount: 0,
      lastError: null
    };
    return put('syncQueue', entry);
  };

  return {
    // ---- Lifecycle -----------------------------------------------------------
    async init() {
      await open();
      const app = await get('settings', 'app');
      if (!app) await put('settings', defaultAppSettings());
      const users = await getAll('users');
      await Promise.all(users.map(async (u) => {
        const n = normalizeUser(u);
        if (JSON.stringify(n) !== JSON.stringify(u)) await put('users', n);
      }));
    },

    // ---- App settings --------------------------------------------------------
    getAppSettings: async () => {
      const app = await get('settings', 'app');
      return app || defaultAppSettings();
    },
    saveAppSettings: async (settings) => put('settings', { ...settings, key: 'app', updatedAt: new Date().toISOString() }),

    // ---- Device / sync metadata (local-only, never synced) -------------------
    async getDeviceMeta() {
      const d = await get('settings', 'device');
      return d || {
        key: 'device',
        clientId: Device.getId(),
        storageMode: 'local',  // 'local' | 'online'
        firebaseConfig: null,
        firebaseUidMap: {},    // localUserId → firebaseUid
        syncStatus: 'idle',    // 'idle' | 'syncing' | 'synced' | 'pending' | 'error'
        lastSyncAt: null,
        syncError: null
      };
    },
    saveDeviceMeta: async (meta) => put('settings', { ...meta, key: 'device' }),

    // Helper used by write methods: enqueue a sync operation when online
    _maybeEnqueue(entityType, entityId, operation, payload, userId) {
      if (typeof Data !== 'undefined' && Data.mode === 'online' && typeof SyncEngine !== 'undefined') {
        // Fire-and-forget; don't await to keep write paths synchronous
        enqueue(entityType, entityId, operation, payload, userId).catch((e) => console.warn('Enqueue failed:', e));
      }
    },

    // ---- Rounds --------------------------------------------------------------
    listRounds: () => getAll('rounds').then((rs) => rs.filter((r) => !r.deletedAt)),
    getRound: (id) => get('rounds', id),
    async createRound(roundInput) {
      const clientId = Device.getId();
      return run(['rounds', 'users'], 'readwrite', ({ rounds, users }) => new Promise((resolve, reject) => {
        const allReq = users.getAll();
        allReq.onsuccess = () => {
          const existing = (allReq.result || []).map(normalizeUser);
          const map = new Map(existing.map((u) => [Utils.fullName(u).toLowerCase(), u]));
          const participantIds = [];
          roundInput.userNames.forEach((fullName) => {
            const key = fullName.toLowerCase();
            let user = map.get(key);
            if (!user) {
              const parsed = Utils.parseName(fullName);
              user = normalizeUser({
                id: Utils.id(),
                username: `${parsed.firstName}.${parsed.lastName}`.toLowerCase().replace(/\.+/g, '.').replace(/[^a-z0-9.]/g, ''),
                firstName: parsed.firstName,
                lastName: parsed.lastName,
                createdAt: new Date().toISOString(),
                isAdmin: false,
                isMaster: false
              });
              users.put(user);
              map.set(key, user);
            }
            participantIds.push(user.id);
          });
          const now = new Date().toISOString();
          const round = {
            ...metaDefaults(),
            id: Utils.id(),
            title: roundInput.title,
            weeksCount: Utils.safeNum(roundInput.weeksCount),
            holidaysAllowed: Utils.safeNum(roundInput.holidaysAllowed),
            entryFee: Utils.safeNum(roundInput.entryFee),
            startDate: roundInput.startDate,
            weighDay: Utils.safeNum(roundInput.weighDay),
            participantIds,
            payoutMode: roundInput.payoutMode,
            prizeSplits: roundInput.prizeSplits,
            status: 'active',
            createdAt: now,
            updatedAt: now,
            clientId
          };
          rounds.put(round);
          resolve(round);
          OfflineAdapter._maybeEnqueue('rounds', round.id, 'CREATE', round, null);
        };
        allReq.onerror = () => reject(allReq.error);
      }));
    },
    updateRound: async (round) => {
      const updated = { ...round, updatedAt: new Date().toISOString(), version: (round.version || 1) + 1, updatedBy: round.updatedBy };
      await put('rounds', updated);
      OfflineAdapter._maybeEnqueue('rounds', updated.id, 'UPDATE', updated, updated.updatedBy);
      return updated;
    },
    deleteRound: async (id) => {
      const now = new Date().toISOString();
      if (typeof Data !== 'undefined' && Data.mode === 'online') {
        // Soft-delete: mark deletedAt and enqueue so Firestore gets the tombstone
        const round = await get('rounds', id);
        if (round) {
          const tombstone = { ...round, deletedAt: now, updatedAt: now, version: (round.version || 1) + 1 };
          await put('rounds', tombstone);
          OfflineAdapter._maybeEnqueue('rounds', id, 'DELETE', tombstone, null);
        }
        // Also soft-delete associated submissions
        const allSubs = await getAll('submissions');
        const roundSubs = allSubs.filter((s) => s.roundId === id && !s.deletedAt);
        for (const s of roundSubs) {
          const t = { ...s, deletedAt: now, updatedAt: now, version: (s.version || 1) + 1 };
          await put('submissions', t);
          OfflineAdapter._maybeEnqueue('submissions', s.id, 'DELETE', t, null);
        }
      } else {
        const [allSubs, allSnapshots] = await Promise.all([getAll('submissions'), getAll('weeklySnapshots')]);
        await run(['rounds', 'submissions', 'weeklySnapshots'], 'readwrite', ({ rounds, submissions, weeklySnapshots }) => {
          rounds.delete(id);
          allSubs.filter((s) => s.roundId === id).forEach((s) => submissions.delete(s.id));
          allSnapshots.filter((s) => s.roundId === id).forEach((s) => weeklySnapshots.delete(s.id));
        });
      }
    },

    // ---- Users ---------------------------------------------------------------
    listUsers: async () => (await getAll('users')).filter((u) => !u.deletedAt).map(normalizeUser),
    getUserById: async (id) => normalizeUser(await get('users', id)),
    async getUserByUsername(username) {
      const all = await this.listUsers();
      return all.find((u) => u.username.toLowerCase() === String(username || '').trim().toLowerCase()) || null;
    },
    createUser: async (user) => {
      const now = new Date().toISOString();
      const value = normalizeUser({ ...user, createdAt: now, updatedAt: now });
      await put('users', value);
      OfflineAdapter._maybeEnqueue('users', value.id, 'CREATE', value, value.id);
      return value;
    },
    updateUser: async (user) => {
      const updated = normalizeUser({ ...user, updatedAt: new Date().toISOString(), version: (user.version || 1) + 1 });
      await put('users', updated);
      OfflineAdapter._maybeEnqueue('users', updated.id, 'UPDATE', updated, updated.id);
      return updated;
    },
    deleteUser: async (id) => {
      const now = new Date().toISOString();
      if (typeof Data !== 'undefined' && Data.mode === 'online') {
        // Soft-delete: tombstone the user record
        const user = await get('users', id);
        if (user) {
          const tombstone = { ...user, deletedAt: now, updatedAt: now, version: (user.version || 1) + 1 };
          await put('users', tombstone);
          OfflineAdapter._maybeEnqueue('users', id, 'DELETE', tombstone, id);
        }
        // Remove from round participant lists (local only, rounds sync separately)
        const rounds = await getAll('rounds');
        for (const r of rounds.filter((r) => (r.participantIds || []).includes(id))) {
          await put('rounds', { ...r, participantIds: r.participantIds.filter((pid) => pid !== id), updatedAt: now });
        }
        // Soft-delete submissions
        const subs = await getAll('submissions');
        for (const s of subs.filter((s) => s.userId === id && !s.deletedAt)) {
          const t = { ...s, deletedAt: now, updatedAt: now };
          await put('submissions', t);
        }
        // Delete sessions (local only)
        const sessions = await getAll('sessions');
        for (const s of sessions.filter((s) => s.userId === id)) {
          await del('sessions', s.token);
        }
      } else {
        const [rounds, submissions, sessions] = await Promise.all([getAll('rounds'), getAll('submissions'), getAll('sessions')]);
        await run(['users', 'rounds', 'submissions', 'sessions'], 'readwrite', ({ users, rounds: roundsStore, submissions: subsStore, sessions: sessStore }) => {
          users.delete(id);
          rounds.filter((r) => (r.participantIds || []).includes(id)).forEach((round) => {
            roundsStore.put({ ...round, participantIds: round.participantIds.filter((pid) => pid !== id), updatedAt: new Date().toISOString() });
          });
          submissions.filter((s) => s.userId === id).forEach((s) => subsStore.delete(s.id));
          sessions.filter((s) => s.userId === id).forEach((s) => sessStore.delete(s.token));
        });
      }
    },
    async upsertUsersByName(names) {
      const cleaned = [...new Set(names.map((n) => n.trim()).filter(Boolean))];
      if (!cleaned.length) return [];
      return run(['users'], 'readwrite', ({ users }) => new Promise((resolve, reject) => {
        const req = users.getAll();
        req.onsuccess = async () => {
          const all = req.result || [];
          const map = new Map(all.map((u) => [Utils.fullName(normalizeUser(u)).toLowerCase(), normalizeUser(u)]));
          const out = [];
          for (const fullName of cleaned) {
            const key = fullName.toLowerCase();
            let user = map.get(key);
            if (!user) {
              const parsed = Utils.parseName(fullName);
              user = normalizeUser({ id: Utils.id(), username: `${parsed.firstName}.${parsed.lastName}`.toLowerCase().replace(/\.+/g, '.').replace(/[^a-z0-9.]/g, ''), firstName: parsed.firstName, lastName: parsed.lastName, isAdmin: false, isMaster: false, createdAt: new Date().toISOString() });
              users.put(user);
              map.set(key, user);
            }
            out.push(user);
          }
          resolve(out);
        };
        req.onerror = () => reject(req.error);
      }));
    },

    // ---- Submissions ---------------------------------------------------------
    listSubmissions: () => getAll('submissions').then((ss) => ss.filter((s) => !s.deletedAt).map(normalizeSubmission)),
    async recordSubmissionAndSnapshot(submission, snapshot) {
      const norm = normalizeSubmission(submission);
      await run(['submissions', 'weeklySnapshots'], 'readwrite', ({ submissions, weeklySnapshots }) => {
        submissions.put(norm);
        weeklySnapshots.put(snapshot);
      });
      OfflineAdapter._maybeEnqueue('submissions', norm.id, 'CREATE', norm, norm.userId);
    },
    getWeeklySnapshot: (roundId, weekNumber) => get('weeklySnapshots', `${roundId}:${weekNumber}`),

    // ---- Sessions (device-local, never synced) --------------------------------
    createSession: async (token, userId, durationDays) => {
      const now = new Date();
      const row = { token, userId, createdAt: now.toISOString(), updatedAt: now.toISOString(), expiresAt: new Date(now.getTime() + (durationDays * 86400000)).toISOString() };
      await put('sessions', row);
      return row;
    },
    getSession: async (token) => get('sessions', token),
    touchSession: async (token, durationDays) => {
      const s = await get('sessions', token);
      if (!s) return null;
      const now = new Date();
      const next = { ...s, updatedAt: now.toISOString(), expiresAt: new Date(now.getTime() + (durationDays * 86400000)).toISOString() };
      await put('sessions', next);
      return next;
    },
    deleteSession: async (token) => del('sessions', token),

    // ---- Sync queue (used by SyncEngine) -------------------------------------
    listPendingSyncItems: () => run(['syncQueue'], 'readonly', ({ syncQueue }) => new Promise((res, rej) => {
      const items = [];
      const req = syncQueue.index('status').openCursor(IDBKeyRange.only('pending'));
      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (!cursor) return res(items);
        items.push(cursor.value);
        cursor.continue();
      };
      req.onerror = () => rej(req.error);
    })),
    countPendingSyncItems: async () => {
      const conn = await open();
      return new Promise((res, rej) => {
        const tx = conn.transaction(['syncQueue'], 'readonly');
        const req = tx.objectStore('syncQueue').index('status').count(IDBKeyRange.only('pending'));
        req.onsuccess = () => res(req.result || 0);
        req.onerror = () => rej(req.error);
      });
    },
    updateSyncItem: (item) => put('syncQueue', item),
    deleteSyncItem: (changeId) => del('syncQueue', changeId),
    enqueueSyncOperation: enqueue,

    // ---- Data merge (used by SyncEngine to write remote data into IndexedDB) --
    // Conflict strategy (documented):
    //   Rule 1: Different IDs → no conflict, both records coexist.
    //   Rule 2: Same ID, same version → ignore (already up-to-date).
    //   Rule 3: Remote version > local version → remote wins.
    //   Rule 4: Local version > remote version → local wins (skip remote).
    //   Rule 5: Same version, different content → use updatedAt; tie-break by
    //           lexicographic min(clientId) for determinism.
    //   Rule 6: Tombstone (deletedAt set) wins over any non-tombstone record
    //           with older or equal updatedAt.
    //   Rule 7: Admin records (rounds) with version conflicts are surfaced to
    //           the UI rather than silently overwritten.
    async mergeRemoteRecord(storeName, remote) {
      const local = await get(storeName, remote.id);
      if (!local) {
        // Rule 1: new record from another device
        await put(storeName, remote);
        return 'inserted';
      }
      if (local.version === remote.version && local.updatedAt === remote.updatedAt) {
        return 'noop'; // Rule 2
      }
      // Rule 6: tombstone wins
      if (remote.deletedAt && (!local.deletedAt || remote.updatedAt >= local.updatedAt)) {
        await put(storeName, { ...local, ...remote });
        return 'deleted';
      }
      if (local.deletedAt && (!remote.deletedAt || local.updatedAt >= remote.updatedAt)) {
        return 'local-deleted-wins';
      }
      if (remote.version > local.version) {
        await put(storeName, { ...local, ...remote }); // Rule 3
        return 'remote-wins';
      }
      if (local.version > remote.version) {
        return 'local-wins'; // Rule 4
      }
      // Rule 5: same version, use updatedAt then clientId tie-break
      const remoteNewer = remote.updatedAt > local.updatedAt || (remote.updatedAt === local.updatedAt && remote.clientId < local.clientId);
      if (remoteNewer) {
        await put(storeName, { ...local, ...remote });
        return 'remote-wins-lww';
      }
      return 'local-wins-lww';
    },

    // ---- Invites (device-local, never synced) --------------------------------
    listInvites: () => getAll('invites'),
    createInvite: (invite) => put('invites', invite),
    async getInviteByCode(code) {
      const conn = await open();
      return new Promise((res, rej) => {
        const tx = conn.transaction(['invites'], 'readonly');
        const req = tx.objectStore('invites').index('code').get(IDBKeyRange.only(code));
        req.onsuccess = () => res(req.result || null);
        req.onerror = () => rej(req.error);
      });
    },
    deleteInvite: (id) => del('invites', id),
    deleteAllInvites: () => run(['invites'], 'readwrite', ({ invites }) => new Promise((res, rej) => {
      const req = invites.clear();
      req.onsuccess = () => res(true);
      req.onerror = () => rej(req.error);
    })),
    async consumeInvite(code, userId) {
      const invite = await this.getInviteByCode(code);
      if (!invite) return null;
      const updated = { ...invite, usedAt: new Date().toISOString(), usedBy: userId };
      await put('invites', updated);
      return updated;
    },

    // ---- Reset ---------------------------------------------------------------
    async clearAllData() {
      await run(['rounds', 'users', 'submissions', 'weeklySnapshots', 'sessions', 'settings', 'syncQueue', 'invites'], 'readwrite',
        ({ rounds, users, submissions, weeklySnapshots, sessions, settings, syncQueue, invites }) => {
          rounds.clear();
          users.clear();
          submissions.clear();
          weeklySnapshots.clear();
          sessions.clear();
          syncQueue.clear();
          invites.clear();
          settings.put(defaultAppSettings());
        }
      );
    }
  };
})();

// =============================================================================
// FIRESTORE ADAPTER
// Only initialised when storageMode === 'online' with valid Firebase config.
// Uses Firebase 10 compat CDN bundles (window.firebase).
// IMPORTANT: password hashes are NEVER written to Firestore.
// =============================================================================
const FirestoreAdapter = (() => {
  let _app = null;
  let _db = null;   // firebase.firestore() compat instance
  let _auth = null; // firebase.auth() compat instance
  let _challengeId = 'default';

  // Strip sensitive fields before uploading to Firestore
  const sanitiseUser = (u) => {
    const { password, ...safe } = u; // eslint-disable-line no-unused-vars
    return safe;
  };

  // Firestore path: /challenges/{challengeId}/{entityType}/{id}
  const colRef = (entityType) => _db.collection('challenges').doc(_challengeId).collection(entityType);
  const docRef = (entityType, id) => colRef(entityType).doc(id);

  return {
    async init(firebaseConfig, challengeId) {
      if (!window.firebase) throw new Error('Firebase SDK not loaded');
      _challengeId = challengeId || 'default';

      // Re-use existing named app if already initialised
      try {
        _app = window.firebase.app('tenlb-app');
      } catch {
        _app = window.firebase.initializeApp(firebaseConfig, 'tenlb-app');
      }
      _db = _app.firestore();
      _auth = _app.auth();

      // Sign in anonymously so Firestore rules can reference request.auth.uid
      await _auth.signInAnonymously();
      return true;
    },

    getUid() { return _auth?.currentUser?.uid || null; },
    isReady() { return !!_db; },

    async writeRecord(entityType, record) {
      if (!_db) throw new Error('FirestoreAdapter not initialised');
      const payload = entityType === 'users' ? sanitiseUser(record) : record;
      await docRef(entityType, record.id).set(payload, { merge: true });
    },

    async deleteRecord(entityType, id, deletedAt) {
      if (!_db) throw new Error('FirestoreAdapter not initialised');
      await docRef(entityType, id).set({ deletedAt, id }, { merge: true });
    },

    async downloadAll(entityType) {
      if (!_db) throw new Error('FirestoreAdapter not initialised');
      const snap = await colRef(entityType).get();
      return snap.docs.map((d) => d.data());
    },

    subscribe(entityType, onData) {
      if (!_db) return () => {};
      return colRef(entityType).onSnapshot((snap) => {
        snap.docChanges().forEach((change) => {
          if (['added', 'modified'].includes(change.type)) onData(change.doc.data());
        });
      });
    }
  };
})();

// =============================================================================
// DATA — active adapter reference + mode management
// =============================================================================
const Data = {
  adapter: null,
  mode: 'local', // 'local' | 'online'

  async init() {
    this.adapter = OfflineAdapter;
    await this.adapter.init();
    // Read persisted mode
    const meta = await this.adapter.getDeviceMeta();
    this.mode = meta.storageMode || 'local';
  },

  isOnline() { return this.mode === 'online'; }
};

// =============================================================================
// SYNC ENGINE
// Sits between OfflineAdapter (local source of truth) and Firestore.
// Only active when Data.mode === 'online'.
//
// Upload cycle:
//   1. Read pending items from syncQueue.
//   2. Upload each to Firestore (idempotent set).
//   3. On success → mark done. On error → increment retryCount.
//
// Download cycle:
//   4. Fetch all records from each syncable entity type.
//   5. Merge into IndexedDB using conflict rules (mergeRemoteRecord).
//   6. Update lastSyncAt.
//
// Real-time listener subscribes after initial sync and merges changes as they
// arrive. Listener is torn down when Online Mode is disabled.
//
// Retry: exponential backoff, max 5 retries per item (then status = 'error').
// =============================================================================
const SyncEngine = (() => {
  const SYNCABLE = ['users', 'rounds', 'submissions'];
  const MAX_RETRIES = 5;
  let _running = false;
  let _unsubscribers = [];
  let _syncLoopTimer = null;
  const SYNC_INTERVAL_MS = 60 * 1000; // poll every 60 s in addition to real-time

  // Notify the UI that sync state changed
  const notifySyncState = () => {
    window.dispatchEvent(new CustomEvent('tenlb:syncstate'));
  };

  const updateMeta = async (patch) => {
    const meta = await Data.adapter.getDeviceMeta();
    await Data.adapter.saveDeviceMeta({ ...meta, ...patch });
    notifySyncState();
  };

  const backoffMs = (retryCount) => Math.min(30000, 1000 * Math.pow(2, retryCount));

  // Upload one pending sync item to Firestore
  const uploadItem = async (item) => {
    if (item.operation === 'DELETE') {
      await FirestoreAdapter.deleteRecord(item.entityType, item.entityId, item.payload.deletedAt || new Date().toISOString());
    } else {
      await FirestoreAdapter.writeRecord(item.entityType, item.payload);
    }
    await Data.adapter.deleteSyncItem(item.changeId);
  };

  // Upload all pending items
  const uploadPending = async () => {
    const items = await Data.adapter.listPendingSyncItems();
    for (const item of items) {
      // Skip items in backoff period
      if (item.retryCount > 0 && item.lastError) {
        const retryAfter = new Date(item.timestamp).getTime() + backoffMs(item.retryCount);
        if (Date.now() < retryAfter) continue;
      }
      try {
        await Data.adapter.updateSyncItem({ ...item, status: 'uploading' });
        await uploadItem(item);
      } catch (err) {
        const retryCount = item.retryCount + 1;
        const status = retryCount >= MAX_RETRIES ? 'error' : 'pending';
        await Data.adapter.updateSyncItem({ ...item, status, retryCount, lastError: String(err?.message || err), timestamp: new Date().toISOString() });
      }
    }
  };

  // Download all remote records and merge into IndexedDB
  const downloadAll = async () => {
    for (const entityType of SYNCABLE) {
      const records = await FirestoreAdapter.downloadAll(entityType);
      for (const record of records) {
        await Data.adapter.mergeRemoteRecord(entityType, record);
      }
    }
  };

  // Subscribe to real-time Firestore changes
  const subscribeAll = () => {
    _unsubscribers.forEach((fn) => fn());
    _unsubscribers = [];
    for (const entityType of SYNCABLE) {
      const unsub = FirestoreAdapter.subscribe(entityType, async (record) => {
        await Data.adapter.mergeRemoteRecord(entityType, record);
        notifySyncState();
        window.dispatchEvent(new CustomEvent('tenlb:remotechange', { detail: { entityType } }));
      });
      _unsubscribers.push(unsub);
    }
  };

  // Enqueue a mutation for later upload (called by App after local writes)
  const enqueue = (entityType, entityId, operation, payload, userId) => {
    return Data.adapter.enqueueSyncOperation(entityType, entityId, operation, payload, userId);
  };

  return {
    // Start sync engine (called when enabling Online Mode)
    async start() {
      if (_running) return;
      _running = true;
      await updateMeta({ syncStatus: 'syncing', syncError: null });
      try {
        await downloadAll();
        await uploadPending();
        await updateMeta({ syncStatus: 'synced', lastSyncAt: new Date().toISOString(), syncError: null });
      } catch (err) {
        await updateMeta({ syncStatus: 'error', syncError: String(err?.message || err) });
      }
      subscribeAll();
      // Periodic sync loop
      _syncLoopTimer = setInterval(async () => {
        if (!_running) return;
        try {
          await uploadPending();
          const pending = await Data.adapter.countPendingSyncItems();
          const status = pending > 0 ? 'pending' : 'synced';
          await updateMeta({ syncStatus: status, lastSyncAt: new Date().toISOString(), syncError: null });
        } catch (err) {
          await updateMeta({ syncStatus: 'error', syncError: String(err?.message || err) });
        }
      }, SYNC_INTERVAL_MS);
    },

    // Stop sync engine (called when disabling Online Mode)
    async stop() {
      _running = false;
      _unsubscribers.forEach((fn) => fn());
      _unsubscribers = [];
      if (_syncLoopTimer) { clearInterval(_syncLoopTimer); _syncLoopTimer = null; }
      await updateMeta({ syncStatus: 'idle' });
    },

    // Manual retry
    async retryNow() {
      if (!_running) return;
      await updateMeta({ syncStatus: 'syncing' });
      try {
        await uploadPending();
        await downloadAll();
        const pending = await Data.adapter.countPendingSyncItems();
        await updateMeta({ syncStatus: pending > 0 ? 'pending' : 'synced', lastSyncAt: new Date().toISOString(), syncError: null });
      } catch (err) {
        await updateMeta({ syncStatus: 'error', syncError: String(err?.message || err) });
      }
    },

    // Enqueue a local mutation for upload
    enqueue,

    isRunning: () => _running
  };
})();

const Domain = {
  suggestTitle(lastRound) {
    const y = new Date().getFullYear();
    if (!lastRound?.title) return `${y} - round 1`;
    const m = lastRound.title.match(/(\d{4})\s*-\s*round\s*(\d+)/i);
    if (!m) return `${y} - round 1`;
    const year = Number(m[1]);
    const round = Number(m[2]);
    return `${y} - round ${year === y ? round + 1 : 1}`;
  },
  activeRound(rounds) { return rounds.find((r) => r.status === 'active') || null; },
  userMap(users) { return new Map(users.map((u) => [u.id, u])); },
  roundUsers(round, users) {
    const map = this.userMap(users);
    return round.participantIds.map((id) => map.get(id)).filter(Boolean);
  },
  submissionsByRound(submissions, roundId) { return submissions.filter((s) => s.roundId === roundId); },
  submissionFor(subs, week, userId) { return subs.find((s) => s.weekNumber === week && s.userId === userId) || null; },
  latestWeight(subs, userId, weekLimit) {
    return subs.filter((s) => s.userId === userId && s.type === 'weight' && s.weekNumber <= weekLimit)
      .sort((a, b) => b.weekNumber - a.weekNumber)[0] || null;
  },
  firstWeight(subs, userId) {
    return subs.filter((s) => s.userId === userId && s.type === 'weight' && s.weekNumber === 1)[0] || null;
  },
  isForfeit(subs, userId, week) {
    return subs.some((s) => s.userId === userId && s.type === 'forfeit' && s.weekNumber <= week);
  },
  holidaysUsed(subs, userId, week = Infinity) {
    return subs.filter((s) => s.userId === userId && s.type === 'holiday' && s.weekNumber <= week).length;
  },
  calcCurrentWeek(round, users, subs) {
    const participants = this.roundUsers(round, users);
    if (!participants.length) return 1;
    const maxWeek = Math.max(1, ...subs.map((s) => s.weekNumber));
    const weekComplete = (w) => this.isWeekComplete(round, users, subs, w);
    let week = 1;
    for (let w = 1; w <= round.weeksCount; w += 1) {
      week = w;
      if (!weekComplete(w)) return w;
    }
    return Math.min(round.weeksCount, maxWeek);
  },
  isWeekComplete(round, users, subs, week) {
    return this.roundUsers(round, users).every((u) => {
      if (this.isForfeit(subs, u.id, week)) return true;
      return !!this.submissionFor(subs, week, u.id);
    });
  },
  weekView(round, users, subs, week) {
    const participants = this.roundUsers(round, users);
    const ranked = [];
    const holiday = [];
    const forfeit = [];
    const pending = [];
    const startWeights = [];

    participants.forEach((u) => {
      const start = this.firstWeight(subs, u.id);
      if (start) startWeights.push({ user: u, weight: start.weight });

      if (this.isForfeit(subs, u.id, week)) {
        forfeit.push({ user: u });
        return;
      }

      const currentSubmission = this.submissionFor(subs, week, u.id);
      if (!currentSubmission) {
        pending.push({ user: u });
        return;
      }
      if (currentSubmission.type === 'holiday') {
        holiday.push({ user: u, holidaysUsed: this.holidaysUsed(subs, u.id, week) });
        return;
      }
      if (currentSubmission.type !== 'weight' || !start) {
        pending.push({ user: u });
        return;
      }

      const prevWeightSubmission = this.latestWeight(subs, u.id, week - 1);
      const startWeight = Utils.safeNum(start.weight);
      const currentWeight = Utils.safeNum(currentSubmission.weight);
      const previousWeight = prevWeightSubmission ? Utils.safeNum(prevWeightSubmission.weight) : startWeight;
      const totalLoss = Utils.round2(startWeight - currentWeight);
      const weeklyLoss = Utils.round2(previousWeight - currentWeight);
      const percentLoss = startWeight > 0 ? Utils.round2((totalLoss / startWeight) * 100) : 0;
      ranked.push({ user: u, startWeight, currentWeight, totalLoss, weeklyLoss, percentLoss });
    });

    ranked.sort((a, b) => b.percentLoss - a.percentLoss);
    return { ranked, holiday, forfeit, pending, startWeights };
  },
  payoutRankIndices(round) {
    return (round.prizeSplits || []).map((v, i) => ({ v: Utils.safeNum(v), i })).filter((x) => x.v > 0).map((x) => x.i);
  },
  prizeTotal(round) { return Utils.round2(round.entryFee * round.participantIds.length); }
};

const App = {

    route: 'overview',
    message: '',
    error: '',
    rounds: [],
    users: [],
    submissions: [],
    invites: [],
    selectedRoundId: null,
    weekCursor: {},
    createDraft: null,
    settingsTab: 'user',
    currentUser: null,
    appSettings: null,
    sessionToken: null,
    redirectAfterLogin: 'overview',
    selectedUsers: [],
    syncMeta: null,        // device/sync metadata (from getDeviceMeta)
    inviteDetail: null,    // current invite being viewed
    pendingInviteCode: ''  // invite code from URL query param
  },

  isInstalled() { return !!this.state.appSettings?.installed; },
  isAuthenticated() { return !!this.state.currentUser; },
  isAdmin(user = this.state.currentUser) { return !!(user && (user.isAdmin || user.isMaster)); },

  async init() {
    await Data.init();
    await this.loadSettings();
    await this.loadSyncMeta();
    this.setupPwa();

    // Read invite code from URL query param (e.g. ?invite=ABCD1234)
    const urlParams = new URLSearchParams(window.location.search);
    const inviteCode = urlParams.get('invite') || '';
    if (inviteCode) this.state.pendingInviteCode = inviteCode.toUpperCase();

    if (!this.isInstalled()) {
      // Install screen only accessible via ?setup=1 (or #install hash) and only when not yet installed
      const isSetupUrl = urlParams.get('setup') === '1' || window.location.hash === '#install';
      this.state.route = isSetupUrl ? 'install' : 'join';
      this.attachNav();
      this.render();
      return;
    }

    await this.restoreSessionFromCookie();
    // If not authenticated and invite code is in URL, go directly to join screen
    if (!this.isAuthenticated()) {
      this.state.route = inviteCode ? 'join' : 'login';
    }
    await this.refresh();
    this.applyTheme();
    this.attachNav();
    this.render();

    // Resume Online Mode if it was active on last session
    if (Data.mode === 'online' && this.state.syncMeta?.firebaseConfig) {
      this._initOnlineMode(this.state.syncMeta.firebaseConfig).catch((err) => {
        console.warn('Online Mode could not resume:', err.message);
      });
    }

    // Listen for remote changes to refresh UI
    window.addEventListener('tenlb:remotechange', () => this.refresh().then(() => this.render()));
    window.addEventListener('tenlb:syncstate', () => this.loadSyncMeta().then(() => this.render()));
  },

  async loadSyncMeta() {
    this.state.syncMeta = await Data.adapter.getDeviceMeta();
  },

  async loadSettings() {
    this.state.appSettings = await Data.adapter.getAppSettings();
    document.getElementById('server-title').textContent = this.state.appSettings.serverName || '10lb Challenge';
  },

  applyTheme() {
    document.body.setAttribute('data-theme', this.state.appSettings?.theme || 'teal');
  },

  async restoreSessionFromCookie() {
    const token = Utils.getCookie('tenlb_session');
    if (!token) return;
    const session = await Data.adapter.getSession(token);
    if (!session) {
      Utils.clearCookie('tenlb_session');
      return;
    }
    if (new Date(session.expiresAt).getTime() < Date.now()) {
      await Data.adapter.deleteSession(token);
      Utils.clearCookie('tenlb_session');
      return;
    }
    const user = await Data.adapter.getUserById(session.userId);
    if (!user) {
      await Data.adapter.deleteSession(token);
      Utils.clearCookie('tenlb_session');
      return;
    }
    this.state.currentUser = user;
    this.state.sessionToken = token;
    await Data.adapter.touchSession(token, this.state.appSettings.sessionDurationDays || 7);
    Utils.setCookie('tenlb_session', token, this.state.appSettings.sessionDurationDays || 7);
  },

  async loginAs(user) {
    const token = Security.sessionToken();
    await Data.adapter.createSession(token, user.id, this.state.appSettings.sessionDurationDays || 7);
    const updated = { ...user, lastLoginAt: new Date().toISOString() };
    await Data.adapter.updateUser(updated);
    this.state.currentUser = updated;
    this.state.sessionToken = token;
    Utils.setCookie('tenlb_session', token, this.state.appSettings.sessionDurationDays || 7);
    // Enqueue user update for sync if online
    if (Data.isOnline() && SyncEngine.isRunning()) {
      await SyncEngine.enqueue('users', updated.id, 'UPDATE', updated, updated.id);
    }
  },

  async logout() {
    if (this.state.sessionToken) await Data.adapter.deleteSession(this.state.sessionToken);
    Utils.clearCookie('tenlb_session');
    this.state.currentUser = null;
    this.state.sessionToken = null;
    this.state.route = this.isInstalled() ? 'login' : 'join';
    this.attachNav();
    this.render();
  },

  // ---------------------------------------------------------------------------
  // Online Mode management
  // ---------------------------------------------------------------------------
  async _initOnlineMode(firebaseConfig) {
    // Lazily load Firebase SDK scripts if not yet loaded
    await this._loadFirebaseSDK();

    await FirestoreAdapter.init(firebaseConfig, 'default');
    Data.mode = 'online';

    const meta = await Data.adapter.getDeviceMeta();
    await Data.adapter.saveDeviceMeta({ ...meta, storageMode: 'online', firebaseConfig });

    // If the current user is a master admin, register their firebase UID
    // in Firestore so security rules grant admin access
    const currentUser = this.state.currentUser;
    if (currentUser && (currentUser.isAdmin || currentUser.isMaster) && FirestoreAdapter.isReady()) {
      const uid = FirestoreAdapter.getUid();
      if (uid) {
        try {
          const app = window.firebase.app('tenlb-app');
          await app.firestore()
            .collection('challenges').doc('default')
            .collection('admins').doc(uid)
            .set({ grantedAt: new Date().toISOString(), localUserId: currentUser.id, isAdmin: currentUser.isAdmin, isMaster: currentUser.isMaster }, { merge: true });
        } catch (e) {
          console.warn('Could not write admin entry to Firestore:', e.message);
        }
      }
    }

    await SyncEngine.start();
    await this.loadSyncMeta();
    this.render();
  },

  async _loadFirebaseSDK() {
    if (window.firebase?.firestore) return; // compat bundles already loaded
    const loadScript = (src) => new Promise((res, rej) => {
      if (document.querySelector(`script[src="${src}"]`)) return res();
      const s = document.createElement('script');
      s.src = src;
      s.onload = res;
      s.onerror = () => rej(new Error(`Failed to load Firebase SDK from ${src}`));
      document.head.appendChild(s);
    });
    // Use Firebase 10 compat bundles — these expose window.firebase with v8-style API
    const CDN = 'https://www.gstatic.com/firebasejs/10.12.0';
    await loadScript(`${CDN}/firebase-app-compat.js`);
    await loadScript(`${CDN}/firebase-auth-compat.js`);
    await loadScript(`${CDN}/firebase-firestore-compat.js`);
  },

  async enableOnlineMode(firebaseConfig) {
    const meta = await Data.adapter.getDeviceMeta();
    await Data.adapter.saveDeviceMeta({ ...meta, syncStatus: 'syncing', syncError: null });
    await this.loadSyncMeta();
    this.render();

    try {
      await this._initOnlineMode(firebaseConfig);
      this.setMessage('Online Mode enabled. Synchronising…');
    } catch (err) {
      // Graceful degradation — remain in Local Mode
      Data.mode = 'local';
      const failMeta = await Data.adapter.getDeviceMeta();
      await Data.adapter.saveDeviceMeta({ ...failMeta, storageMode: 'local', syncStatus: 'error', syncError: String(err?.message || err) });
      await this.loadSyncMeta();
      this.fail(`Failed to enable Online Mode: ${err.message || err}. Remaining in Local Mode.`);
    }
  },

  async disableOnlineMode() {
    const pending = await Data.adapter.countPendingSyncItems();
    if (pending > 0) {
      const msg = `You have ${pending} change${pending !== 1 ? 's' : ''} that have not been uploaded. They will remain on this device and can be synchronised if Online Mode is enabled again.`;
      if (!confirm(msg + '\n\nDisable Online Mode anyway?')) return;
    }
    await SyncEngine.stop();
    Data.mode = 'local';
    const meta = await Data.adapter.getDeviceMeta();
    await Data.adapter.saveDeviceMeta({ ...meta, storageMode: 'local' });
    await this.loadSyncMeta();
    this.setMessage('Online Mode disabled. Using local storage only.');
    this.render();
  },

  async testFirebaseConnection(firebaseConfig) {
    try {
      await this._loadFirebaseSDK();
      // Use a temporary named app to test connectivity
      const testName = `tenlb-test-${Date.now()}`;
      const tempApp = window.firebase.initializeApp(firebaseConfig, testName);
      const tempAuth = tempApp.auth();
      await tempAuth.signInAnonymously();
      const tempDb = tempApp.firestore();
      await tempDb.collection('challenges').doc('default').get();
      await tempApp.delete();
      return { ok: true };
    } catch (err) {
      return { ok: false, error: err.message || String(err) };
    }
  },

  setupPwa() {
    const manifest = {
      name: '10lb Challenge',
      short_name: '10lb',
      start_url: './',
      display: 'standalone',
      background_color: '#f6f8fb',
      theme_color: '#0f766e',
      icons: [{ src: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 180 180%22%3E%3Crect width=%22180%22 height=%22180%22 rx=%2232%22 fill=%22%230f766e%22/%3E%3Ctext x=%2290%22 y=%22112%22 font-size=%2272%22 text-anchor=%22middle%22 fill=%22white%22%3E10%3C/text%3E%3C/svg%3E', sizes: '180x180', type: 'image/svg+xml' }]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  },

  canAccess(route) {
    // join is the registration screen — accessible when not installed or always for unauthenticated
    if (route === 'join') return true;
    if (!this.isInstalled()) return route === 'install';
    if (['install', 'login'].includes(route)) return true;
    if (!this.isAuthenticated()) return false;
    if (['overview', 'rounds', 'submit', 'settings'].includes(route)) return true;
    return this.isAdmin();
  },

  attachNav() {
    const nav = document.getElementById('nav');
    const authChip = document.getElementById('auth-chip');
    const syncBar = document.getElementById('sync-bar');

    if (!this.isInstalled() || !this.isAuthenticated()) {
      nav.innerHTML = '';
      authChip.innerHTML = '';
      if (syncBar) syncBar.style.display = 'none';
      return;
    }

    const items = [
      ['overview', 'Current Round'],
      ['rounds', 'Rounds'],
      ['submit', 'Submit']
    ];
    if (this.isAdmin()) items.push(['create', 'Create'], ['users', 'Users'], ['invites', 'Invites']);
    items.push(['settings', 'Settings']);

    nav.innerHTML = items.map(([key, label]) => `<button data-route="${key}">${label}</button>`).join('');
    nav.onclick = (e) => {
      const b = e.target.closest('button[data-route]');
      if (!b) return;
      this.navigate(b.dataset.route);
    };

    authChip.innerHTML = `${Utils.esc(Utils.fullName(this.state.currentUser))} <span class="tag">${this.state.currentUser.isMaster ? 'Master' : (this.isAdmin() ? 'Admin' : 'User')}</span> <button class="btn secondary small" id="btn-logout">Logout</button>`;
    const logoutBtn = document.getElementById('btn-logout');
    if (logoutBtn) logoutBtn.onclick = () => this.logout();

    // Sync status bar
    if (syncBar && this.state.syncMeta) {
      const meta = this.state.syncMeta;
      const mode = meta.storageMode || 'local';
      const status = meta.syncStatus || 'idle';
      const statusIcons = { idle: '', syncing: '↻', synced: '✓', pending: '⚠', error: '✗' };
      const statusText = { idle: '', syncing: 'Syncing…', synced: `Synced ${meta.lastSyncAt ? Utils.dateTime(meta.lastSyncAt) : ''}`, pending: 'Changes pending', error: 'Sync error' };
      if (mode === 'online') {
        syncBar.style.display = 'block';
        syncBar.textContent = `${statusIcons[status] || ''} ONLINE — ${statusText[status] || status}`;
      } else {
        syncBar.style.display = 'none';
      }
    }
  },

  async refresh() {
    this.state.rounds = await Data.adapter.listRounds();
    this.state.users = await Data.adapter.listUsers();
    this.state.submissions = await Data.adapter.listSubmissions();
    this.state.invites = await Data.adapter.listInvites();
    const active = Domain.activeRound(this.state.rounds);
    if (!this.state.selectedRoundId) this.state.selectedRoundId = active?.id || this.state.rounds[0]?.id || null;
    if (this.state.currentUser) {
      this.state.currentUser = this.state.users.find((u) => u.id === this.state.currentUser.id) || this.state.currentUser;
    }
  },

  setMessage(msg = '', err = '') { this.state.message = msg; this.state.error = err; },

  async navigate(route) {
    this.state.error = '';
    this.state.message = '';

    if (!this.canAccess(route)) {
      if (!this.isAuthenticated()) {
        this.state.redirectAfterLogin = route;
        this.state.route = 'login';
      } else {
        this.state.route = 'denied';
      }
      this.render();
      return;
    }

    if (route === 'login' && this.isAuthenticated()) route = 'overview';
    if (route === 'join' && this.isAuthenticated()) route = 'overview';
    this.state.route = route;
    this.render();
  },

  currentRound() {
    if (this.state.selectedRoundId) {
      const exact = this.state.rounds.find((r) => r.id === this.state.selectedRoundId);
      if (exact) return exact;
    }
    return Domain.activeRound(this.state.rounds) || this.state.rounds[0] || null;
  },

  render() {
    this.attachNav();
    this.applyTheme();
    document.getElementById('server-title').textContent = this.state.appSettings?.serverName || '10lb Challenge';

    const app = document.getElementById('app');
    const flash = `${this.state.error ? `<p class="error">${this.state.error}</p>` : ''}${this.state.message ? `<p class="ok">${this.state.message}</p>` : ''}`;

    if (!this.isInstalled()) {
      if (this.state.route === 'install') {
        app.innerHTML = flash + this.renderInstall();
      } else {
        app.innerHTML = flash + this.renderJoin();
      }
      this.bindScreenEvents();
      return;
    }

    if (!this.isAuthenticated()) {
      if (this.state.route === 'join') {
        app.innerHTML = flash + this.renderJoin();
      } else {
        app.innerHTML = flash + this.renderLogin();
      }
      this.bindScreenEvents();
      return;
    }

    if (this.state.route === 'denied') app.innerHTML = flash + this.renderDenied();
    if (this.state.route === 'overview') app.innerHTML = flash + this.renderOverview();
    if (this.state.route === 'rounds') app.innerHTML = flash + this.renderRoundList();
    if (this.state.route === 'create') app.innerHTML = flash + this.renderCreate();
    if (this.state.route === 'edit') app.innerHTML = flash + this.renderEdit();
    if (this.state.route === 'delete') app.innerHTML = flash + this.renderDelete();
    if (this.state.route === 'submit') app.innerHTML = flash + this.renderSubmit();
    if (this.state.route === 'users') app.innerHTML = flash + this.renderUsers();
    if (this.state.route === 'settings') app.innerHTML = flash + this.renderSettings();
    if (this.state.route === 'invites') app.innerHTML = flash + this.renderInvites();
    if (this.state.route === 'invite-detail') app.innerHTML = flash + this.renderInviteDetail();

    this.bindScreenEvents();
  },

  },

        <div><label>Password</label><input name="password" type="password" required autocomplete="new-password" /></div>

  renderLogin() {

      <p class="muted">Enter your account details to continue.</p>

  renderOverview() {
    const round = this.currentRound();
    if (!round) return `<div class="card"><h2>No challenges active</h2><p class="muted">Start a new round to begin.</p>${this.isAdmin() ? '<button class="btn" data-go="create">Start New Round</button>' : ''}</div>`;

    const currentWeek = Domain.calcCurrentWeek(round, this.state.users, subs);
    const selectedWeek = this.state.weekCursor[round.id] || Math.min(currentWeek, round.weeksCount);
    const view = Domain.weekView(round, this.state.users, subs, selectedWeek);
    const prizeRanks = Domain.payoutRankIndices(round);
    const isFinalComplete = Domain.isWeekComplete(round, this.state.users, subs, round.weeksCount);
    const prizeEmoji = ['🏆','🥈','🥉','🎖️','🎗️','⭐','✨'];

    const unit = this.state.appSettings.weightFormat || 'lb';
    return `<div class="card">

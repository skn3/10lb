# Workflow for building and deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install esbuild
        run: npm install --global esbuild

      - name: Build
        run: |
          # Create the dist folder that will be deployed
          mkdir -p dist/fonts

          # Bundle all JS modules from source/ into a single IIFE bundle.
          # source/config.js is included directly by the bundle (no config.json conversion).
          # React/ReactDOM/ReactRouterDOM are loaded from CDN before bundle.js
          # so they remain globals and do not need to be bundled.
          esbuild source/main.js \
            --bundle \
            --format=iife \
            --outfile=dist/bundle.js

          cp source/index.html dist/index.html
          cp source/sw.js dist/sw.js
          cp source/fonts/MaterialSymbolsRounded.woff2 dist/fonts/MaterialSymbolsRounded.woff2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy only the built dist folder (served from domain root)
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
